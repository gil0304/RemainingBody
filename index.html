<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>残る身体 / Remaining Body</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #050505;
        overflow: hidden;
      }
      #app,
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
      }
      /* Staff-only message. Hidden in all normal operation (spec §63). */
      #staff-message {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.26);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        letter-spacing: 0.12em;
        pointer-events: none;
        user-select: none;
      }
      #staff-message.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="staff-message">Camera unavailable</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
